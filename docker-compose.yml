services:
  # ============================================================================
  # BANCO DE DADOS RELACIONAL (POSTGRESQL 16)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: shopee_zap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-shopee_whatsapp_saas}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - shopee_zap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shopee_whatsapp_saas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopee_zap_network

  # ============================================================================
  # FILAS E CACHE (REDIS 7)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: shopee_zap_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6382}:6379"
    volumes:
      - shopee_zap_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shopee_zap_network

  # ============================================================================
  # INICIALIZAÇÃO DO BANCO DA EVOLUTION API (ISOLADO DO SCHEMA DO SAAS)
  # ============================================================================
  evolution-db-init:
    image: postgres:16-alpine
    container_name: shopee_zap_evolution_db_init
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -h postgres -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-shopee_whatsapp_saas}" -tc "SELECT 1 FROM pg_database WHERE datname = '${EVOLUTION_DB_NAME:-evolution_api}'" | grep -q 1 || psql -h postgres -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-shopee_whatsapp_saas}" -c "CREATE DATABASE \"${EVOLUTION_DB_NAME:-evolution_api}\""
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopee_zap_network

  # ============================================================================
  # EVOLUTION API v2 (WHATSAPP BAILEYS DOCKER)
  # ============================================================================
  evolution-api:
    image: evoapicloud/evolution-api:${EVOLUTION_IMAGE_TAG:-v2.3.7}
    container_name: shopee_zap_evolution_api
    restart: unless-stopped
    environment:
      DOCKER_ENV: 'true'
      SERVER_NAME: evolution
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_dev_global_api_key_change_in_prod}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'true'
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${EVOLUTION_DB_NAME:-evolution_api}?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: shopee_zap_evolution
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'true'
      DATABASE_SAVE_DATA_LABELS: 'false'
      DATABASE_SAVE_DATA_HISTORIC: 'false'
      DATABASE_SAVE_IS_ON_WHATSAPP: 'false'
      DATABASE_DELETE_MESSAGE: 'true'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_TTL: 604800
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      DEL_INSTANCE: 'false'
      CONFIG_SESSION_PHONE_CLIENT: ShopeeZap
      CONFIG_SESSION_PHONE_NAME: Chrome
      CORS_ORIGIN: ${EVOLUTION_CORS_ORIGIN:-*}
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: 'true'
      TELEMETRY_ENABLED: 'false'
      LANGUAGE: pt-BR
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    volumes:
      - shopee_zap_evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shopee_zap_network

  # ============================================================================
  # BACKEND API & WORKER (NESTJS + PRISMA + BULLMQ)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopee_zap_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/${POSTGRES_DB:-shopee_whatsapp_saas}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_min_32_chars_long}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_change_in_production_32_chars}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-dev_webhook_secret_key_change_in_production}
      EVOLUTION_DOCKER_ENABLED: ${EVOLUTION_DOCKER_ENABLED:-true}
      EVOLUTION_DOCKER_BASE_URL: http://evolution-api:8080
      EVOLUTION_SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      EVOLUTION_DOCKER_API_KEY: ${EVOLUTION_API_KEY:-evolution_dev_global_api_key_change_in_prod}
    ports:
      - "${BACKEND_PORT:-3005}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shopee_zap_network

  # ============================================================================
  # FRONTEND (VUE 3 + VITE + TAILWIND)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopee_zap_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3005}/api
    depends_on:
      - backend
    networks:
      - shopee_zap_network

volumes:
  shopee_zap_pgdata:
  shopee_zap_redisdata:
  shopee_zap_evolution_instances:

networks:
  shopee_zap_network:
    name: shopee_zap_network
    driver: bridge
